architectury {
    common(["fabric", "neoforge"])
}

dependencies {
    // For @Environment annotations
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Cloth Config API (compile only in common; actual runtime provided per platform)
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    // Architectury API common
    //implementation "dev.architectury:architectury:${rootProject.architectury_api_version}"

    // Use Loom's remapping for mod dependencies to match Yarn named namespace
    modCompileOnly "net.oxcodsnet.roadarchitect.common:roadarchitect-common-mc${rootProject.minecraft_version}:${rootProject.roadarchitect_version}"
}
